ros__parameters:
  tf_static_delay: 5.0

  realsense:
    camera_name: "camera"
    camera_namespace: "camera" # tópicos em /camera/camera/...
    enable_color: true
    enable_depth: true
    enable_infra: false
    enable_infra1: false
    enable_infra2: false
    enable_gyro: true
    enable_accel: true
    unite_imu_method: 1        # 1=copy → /camera/camera/imu
    pointcloud_enable: true
    align_depth_enable: true
    enable_sync: false
    publish_tf: true

  # Atualizar xyz com medidas reais do robô 4WD
  laser_tf:
    parent_frame: "base_link"
    child_frame:  "laser_link"
    xyz: [0.18, 0.0, 0.24]
    rpy: [0.0,  0.0, 0.0]

  camera_tf:
    parent_frame: "base_link"
    child_frame:  "camera_link"
    xyz: [0.18, 0.0, 0.25]
    rpy: [0.0,  0.0, 0.0]
