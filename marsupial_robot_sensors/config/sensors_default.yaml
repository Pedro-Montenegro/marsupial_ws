ros__parameters:
  tf_static_delay: 5.0

  realsense:
    camera_name: "camera"
    camera_namespace: ""       # tópicos em /camera/...
    enable_gyro: true
    enable_accel: true
    unite_imu_method: 1        # 1=linear_interpolation → /camera/imu
    align_depth_enable: true
    publish_tf: false

  # Atualizar xyz com medidas reais do robô 4WD
  laser_tf:
    parent_frame: "base_link"
    child_frame:  "laser_link"
    xyz: [0.18, 0.0, 0.24]
    rpy: [0.0,  0.0, 0.0]

  camera_tf:
    parent_frame: "base_link"
    child_frame:  "camera_link"
    xyz: [0.18, 0.0, 0.25]
    rpy: [0.0,  0.0, 0.0]
