# =========================
# NAV2 PARAMS - Marsupial ROBÔ
# Versão corrigida para estabilizar bringup + recoveries
# =========================

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0

    min_x_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.05

    speed_limit_topic: "/speed_limit"

    controller_plugins: ["FollowPath"]
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 8.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.30
      stateful: true

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      vx_max: 0.5
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 2.0

      vx_std: 0.3
      wz_std: 0.8

      ax_max: 1.5
      ax_min: -1.5
      az_max: 2.0

      time_steps: 36
      model_dt: 0.1
      batch_size: 1000
      iteration_count: 1

      prune_distance: 1.5
      transform_tolerance: 0.5

      critics: [
        "ConstraintCritic",
        "ObstaclesCritic",
        "CostCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PreferForwardCritic"
      ]

      ConstraintCritic:
        enabled: true
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_weight: 6.0
        critical_cost: 300.0
        consider_footprint: true

      GoalCritic:
        enabled: true
        cost_weight: 3.0
        threshold_to_consider: 2.0

      GoalAngleCritic:
        enabled: true
        cost_weight: 4.0
        threshold_to_consider: 0.2

      PathAlignCritic:
        enabled: true
        cost_weight: 1.5
        max_path_occupancy_ratio: 0.1
        trajectory_point_step: 2

      PathFollowCritic:
        enabled: true
        cost_weight: 2.0
        threshold_to_consider: 1.5
        trajectory_point_step: 2

      ObstaclesCritic:
        enabled: true
        repulsion_weight: 6.0
        critical_weight: 20.0
        consider_footprint: true
        collision_cost: 100000.0
        collision_margin_distance: 0.4
        near_goal_distance: 0.5

      PreferForwardCritic:
        enabled: true
        cost_weight: 2.0
        threshold_to_consider: 0.5


planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      allow_unknown: true
      tolerance: 0.2
      downsample_costmap: false
      max_iterations: 100000
      motion_model_for_search: "MOORE"
      angle_quantization_bins: 16
      smooth_path: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5

      rolling_window: false
      resolution: 0.05
      track_unknown_space: true

      footprint: "[[0.10, 0.20], [0.10, -0.20], [-0.50, -0.20], [-0.50, 0.20]]"

      plugins:
        - static_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5
        cost_scaling_factor: 4.0


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.5

      rolling_window: true
      width: 7
      height: 7
      resolution: 0.05

      update_frequency: 10.0
      publish_frequency: 5.0

      footprint: "[[0.10, 0.20], [0.10, -0.20], [-0.50, -0.20], [-0.50, 0.20]]"

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_range: 3.0
          raytrace_range: 3.5
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          transform_tolerance: 0.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5
        cost_scaling_factor: 3.0


bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link

    default_bt_xml_filename: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_and_recovery.xml"

    bt_loop_duration: 100
    default_server_timeout: 20
    wait_for_service_timeout: 2000


behavior_server:
  ros__parameters:
    use_sim_time: false

    # Importante: recoveries trabalham localmente com a local_costmap
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5

    cycle_frequency: 10.0

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
      speed: 0.15
      time_allowance: 3.0

    wait:
      plugin: "nav2_behaviors/Wait"
      wait_duration: 2.0


waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false

    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: false
      waypoint_pause_duration: 0


velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"

    max_velocity: [0.5, 0.0, 2.0]
    min_velocity: [0.0, 0.0, -2.0]

    max_accel: [1.5, 0.0, 2.0]
    max_decel: [-1.5, 0.0, -2.0]

    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0


lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true

    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother