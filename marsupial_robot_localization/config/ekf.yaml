ekf_odom:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    predict_to_current_time: true
    print_diagnostics: true

    world_frame: odom
    odom_frame:  odom
    base_link_frame: base_link

    # ── Odometria das rodas ───────────────────────────────────────────────
    # Funde apenas vx e wz (velocidades) — posição absoluta vem do AMCL
    odom0: wheel/odom
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false
    odom0_config: [ false, false, false,
                    false, false, false,
                    true,  false, false,
                    false, false, true,
                    false, false, false ]
    odom0_pose_rejection_threshold: 3.0
    odom0_twist_rejection_threshold: 3.0

    # ── IMU RealSense D435i ───────────────────────────────────────────────
    # /camera/imu requer unite_imu_method=1 no rs_launch.py
    # Funde yaw (orientação) e wz (velocidade angular)
    imu0: /camera/camera/imu
    imu0_queue_size: 10
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravity: true
    imu0_config: [ false, false, false,
                   false, false, true,
                   false, false, false,
                   false, false, true,
                   false, false, false ]

    process_noise_covariance: [
